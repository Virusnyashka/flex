<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Календарь смен и расчёт зарплаты.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a6d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Зарплата Flex">
  <link rel="apple-touch-icon" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Моя зарплата Flex</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Цвета совпадают с темой приложения: сверху — шапка,
       снизу — нижняя панель. Видны под строкой
       состояния iOS и под полоской «Домой». */
    :root { --top: #1f7a6d; --bottom: #e9efec; }
    @media (prefers-color-scheme: dark) {
      :root { --top: #0e1513; --bottom: #1b211f; }
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(to bottom, var(--top) 50%, var(--bottom) 50%);
    }
    /* Приложение занимает экран между вырезом сверху и полоской «Домой». */
    #app {
      position: fixed;
      top: env(safe-area-inset-top);
      bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
